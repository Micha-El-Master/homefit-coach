<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test de niveau — HomeFit Coach</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#d4361a" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .lt-steps { display: flex; gap: 6px; margin: 0 0 16px; }
  .lt-steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .lt-steps span.done, .lt-steps span.current { background: var(--primary); }
  .lt-timer { font-size: 44px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 4px 0 12px; }
  .lt-stepper { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
  .lt-stepper button { width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 26px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .lt-stepper output { flex: 1; text-align: center; font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lt-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px; }
  .lt-list { margin: 0 0 16px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .lt-list li { display: flex; align-items: center; gap: 10px; color: var(--text-muted); }
  .lt-list li::before { content: ''; width: 10px; height: 10px; border-radius: 5px; background: var(--border); flex-shrink: 0; }
  .lt-list li.done::before { background: var(--accent); }
  .lt-list li.current { color: var(--text); font-weight: 700; }
  .lt-list li.current::before { background: var(--primary); }
  .lt-gauge { display: flex; gap: 4px; margin: 10px 0 4px; }
  .lt-gauge span { flex: 1; height: 12px; border-radius: 4px; background: var(--border); }
  .lt-gauge span.on { background: var(--primary); }
  .lt-curve { display: flex; align-items: flex-end; gap: 5px; height: 110px; margin: 12px 0 8px; }
  .lt-curve span { flex: 1; background: var(--primary); border-radius: 3px; }
  .lt-curve span.deload { background: var(--text-muted); }
  .lt-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); gap: 8px; }
  .lt-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .lt-row:last-child { border-bottom: none; }
  .lt-skip { display: block; text-align: center; font-size: 14px; color: var(--text-muted); text-decoration: underline; padding: 12px; margin-top: 8px; }
  .lt-hint { font-size: 14px; line-height: 1.45; color: var(--text-muted); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="app-shell" role="main">
  <section id="view-test" aria-live="polite">
    <p class="lt-eyebrow" id="lt-eyebrow"></p>
    <div class="lt-steps" id="lt-steps" aria-hidden="true"></div>
    <h1 style="margin:0 0 8px;" id="lt-title"></h1>
    <p class="lt-hint" id="lt-help"></p>

    <div class="card" id="lt-timer-card">
      <div class="lt-timer" id="lt-timer" role="timer">01:00</div>
      <button type="button" class="btn btn-primary" id="lt-timer-btn">Lancer le chrono</button>
    </div>

    <div class="card">
      <label for="lt-value" style="font-weight:700; font-size:14px;" id="lt-value-label">Ton résultat</label>
      <div class="lt-stepper">
        <button type="button" id="lt-minus" aria-label="Moins un">−</button>
        <output id="lt-value" for="lt-minus lt-plus">0</output>
        <button type="button" id="lt-plus" aria-label="Plus un">+</button>
      </div>
      <p id="lt-unit" style="text-align:center; font-size:13px; color:var(--text-muted); margin:0;"></p>
    </div>

    <ul class="lt-list" id="lt-list"></ul>

    <button type="button" class="btn btn-primary" id="lt-next">Test suivant</button>
    <a href="#" class="lt-skip" id="lt-skip">Passer le test et choisir mon niveau</a>
  </section>

  <section id="view-result" hidden>
    <p class="lt-eyebrow">Résultat du test</p>
    <h1 style="margin:0 0 8px;" id="res-title"></h1>
    <p class="lt-hint" id="res-sub">On commence tout doucement. Le programme s’adapte à toi chaque semaine.</p>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <strong id="res-level"></strong>
        <span style="font-size:13px; color:var(--text-muted);" id="res-name"></span>
      </div>
      <div class="lt-gauge" id="res-gauge" aria-hidden="true"></div>
    </div>

    <div class="card">
      <strong>Ton parcours sur 12 semaines</strong>
      <div class="lt-curve" id="res-curve" role="img" aria-label="Volume d’entraînement semaine par semaine"></div>
      <div class="lt-legend"><span id="res-start"></span><span id="res-end"></span></div>
      <p style="font-size:13px; color:var(--text-muted); margin:10px 0 0;">Les semaines 4 et 8 sont allégées pour récupérer (barres grises).</p>
    </div>

    <div class="card">
      <strong>Détail par test</strong>
      <div id="res-detail" style="margin-top:6px;"></div>
    </div>

    <button type="button" class="btn btn-primary" id="res-save">Commencer la semaine 1</button>
    <a href="#" class="lt-skip" id="res-redo">Refaire le test</a>
  </section>
</div>

<script src="js/storage.js"></script>
<script src="js/exercises.js"></script>
<script src="js/workouts.js"></script>
<script src="js/app.js"></script>
<script>
  const onboarding = new URLSearchParams(location.search).get('onboarding') === '1';
  const results = {};
  let step = 0;
  let value = 0;
  let timerId = null;
  let elapsed = 0;

  const $ = (id) => document.getElementById(id);
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

  const STEPS = [
    { test: LEVEL_TESTS[0], title: 'Combien de squats en 60 secondes ?', help: 'Fais-en autant que tu peux avec une bonne forme. Arrête-toi dès que ça se dégrade. Il n’y a pas de mauvais résultat.', timer: 'down', seconds: 60 },
    { test: LEVEL_TESTS[1], title: 'Combien de pompes sur les genoux d’affilée ?', help: 'Mains sous les épaules, dos droit. Compte les répétitions faites sans t’arrêter, puis note ton résultat.', timer: null },
    { test: LEVEL_TESTS[2], title: 'Combien de temps tiens-tu le gainage ?', help: 'Sur les avant-bras, corps aligné. Lance le chrono et arrête-toi quand le dos se creuse.', timer: 'up' },
  ];

  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function setValue(v) {
    const max = STEPS[step].test.max;
    value = Math.min(max, Math.max(0, v));
    $('lt-value').textContent = value;
  }

  function renderStep() {
    stopTimer();
    const s = STEPS[step];
    $('lt-eyebrow').textContent = `Ton point de départ · Test ${step + 1} sur ${STEPS.length}`;
    $('lt-steps').innerHTML = STEPS.map((_, i) => `<span class="${i < step ? 'done' : i === step ? 'current' : ''}"></span>`).join('');
    $('lt-title').textContent = s.title;
    $('lt-help').textContent = s.help;
    $('lt-unit').textContent = s.test.unit;
    $('lt-list').innerHTML = STEPS.map(
      (t, i) => `<li class="${i < step ? 'done' : i === step ? 'current' : ''}">${i + 1} · ${t.test.label}${i < step ? ` : ${results[t.test.id]}` : ''}</li>`
    ).join('');
    $('lt-next').textContent = step === STEPS.length - 1 ? 'Voir mon niveau' : 'Test suivant';
    const hasTimer = !!s.timer;
    $('lt-timer-card').hidden = !hasTimer;
    if (hasTimer) {
      elapsed = 0;
      $('lt-timer').textContent = s.timer === 'down' ? fmt(s.seconds) : fmt(0);
      $('lt-timer-btn').textContent = 'Lancer le chrono';
    }
    setValue(results[s.test.id] ?? 0);
  }

  $('lt-timer-btn').addEventListener('click', () => {
    const s = STEPS[step];
    if (timerId) {
      stopTimer();
      $('lt-timer-btn').textContent = 'Relancer le chrono';
      if (s.timer === 'up') setValue(elapsed);
      return;
    }
    elapsed = 0;
    $('lt-timer-btn').textContent = 'Arrêter';
    timerId = setInterval(() => {
      elapsed += 1;
      if (s.timer === 'down') {
        $('lt-timer').textContent = fmt(Math.max(0, s.seconds - elapsed));
        if (elapsed >= s.seconds) {
          stopTimer();
          $('lt-timer-btn').textContent = 'Relancer le chrono';
        }
      } else {
        $('lt-timer').textContent = fmt(elapsed);
        setValue(elapsed);
      }
    }, 1000);
  });

  $('lt-minus').addEventListener('click', () => setValue(value - 1));
  $('lt-plus').addEventListener('click', () => setValue(value + 1));

  $('lt-next').addEventListener('click', () => {
    results[STEPS[step].test.id] = value;
    if (step < STEPS.length - 1) {
      step += 1;
      renderStep();
    } else {
      showResult();
    }
  });

  $('lt-skip').addEventListener('click', (e) => {
    e.preventDefault();
    location.href = onboarding ? 'dashboard.html' : 'settings.html';
  });

  let computed = null;

  function showResult() {
    stopTimer();
    computed = computeLevelFromTests(results);
    const { score, scores } = computed;
    $('view-test').hidden = true;
    $('view-result').hidden = false;
    $('res-title').textContent = `Tu démarres au niveau ${score}`;
    $('res-level').textContent = `Niveau ${score} sur ${LEVEL_MAX}`;
    $('res-name').textContent = levelNameFromScore(score);
    $('res-gauge').innerHTML = Array.from({ length: LEVEL_MAX }, (_, i) => `<span class="${i < score ? 'on' : ''}"></span>`).join('');

    const curve = getLevelCurve(score);
    const top = Math.max(...curve.map((c) => c.factor));
    $('res-curve').innerHTML = curve.map((c) => `<span class="${c.deload ? 'deload' : ''}" style="height:${Math.round((c.factor / top) * 100)}%"></span>`).join('');
    const gain = Math.round((curve[curve.length - 1].factor / curve[0].factor - 1) * 100);
    $('res-start').textContent = 'Semaine 1 · volume de départ';
    $('res-end').textContent = `Semaine 12 · +${gain} %`;

    $('res-detail').innerHTML = LEVEL_TESTS.map(
      (t) => `<div class="lt-row"><span>${t.label} · ${results[t.id]} ${t.unit === 'secondes' ? 's' : ''}</span><strong>Niveau ${scores[t.id]}</strong></div>`
    ).join('');
    $('res-save').textContent = onboarding ? 'Commencer la semaine 1' : 'Enregistrer mon niveau';
  }

  $('res-save').addEventListener('click', () => {
    const profile = getProfile();
    saveProfile({ ...profile, level: levelFromScore(computed.score), levelScore: computed.score, levelTests: { ...results } });
    location.href = 'dashboard.html';
  });

  $('res-redo').addEventListener('click', (e) => {
    e.preventDefault();
    step = 0;
    Object.keys(results).forEach((k) => delete results[k]);
    $('view-result').hidden = true;
    $('view-test').hidden = false;
    renderStep();
  });

  renderStep();
</script>
</body>
</html>
